<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HIGH DRIVE</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080808;
      --ink: #e8e8d8;
      --dim: #7d806e;
      --panel: #11130f;
      --accent: #d7d05e;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #050605;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      display: grid;
      gap: 14px;
      width: min(100%, 820px);
    }

    .bezel {
      background: linear-gradient(180deg, #24271f, #0c0d0a);
      border: 1px solid #4b4e3d;
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 768px;
      aspect-ratio: 8 / 5;
      margin: 0 auto;
      background: var(--bg);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 1px solid #181a13;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--dim);
      font-size: 13px;
      line-height: 1.5;
    }

    .controls kbd {
      min-width: 24px;
      display: inline-grid;
      place-items: center;
      padding: 1px 6px;
      border: 1px solid #555946;
      border-bottom-color: #303326;
      border-radius: 4px;
      background: #171911;
      color: var(--ink);
      font: inherit;
    }

    @media (max-width: 560px) {
      body {
        padding: 10px;
      }

      .bezel {
        padding: 10px;
      }

      .controls {
        display: grid;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="bezel">
      <canvas id="screen" width="960" height="600" aria-label="HIGH DRIVE game screen"></canvas>
    </div>
    <div class="controls">
      <div><kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> MOVE</div>
      <div><kbd>SPACE</kbd> START / <kbd>Y</kbd> RETRY / <kbd>N</kbd> END</div>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const COLS = 40;
      const ROWS = 25;
      const CELL_W = 24;
      const CELL_H = 24;
      const ROAD_L = 8;
      const ROAD_R = 20;
      const PLAY_R = 28;
      const CH = {
        CAR: "\uE0E0",
        SHADOW: "\uE0E1",
        GROUND: "\uE0E2",
        LEFT: "\uE0E3",
        RIGHT: "\uE0E4",
        SMALL: "\uE0E5",
        BIG: "\uE0E6",
        BAR: "\uE0E7",
        DOT: "\uE0E8",
        BLOCK: "\uE0E9",
        WALL: "\uE0EA",
      };

      const canvas = document.getElementById("screen");
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = false;

      const palette = ["#080808", "#f3f0d0", "#c6c05a", "#77a85c", "#61a0b8", "#b65c56", "#b28fc5", "#dfdfdf"];
      const keys = new Set();
      const cells = Array.from({ length: ROWS }, () => Array(COLS).fill(" "));

      let state = "title";
      let x1 = 14;
      let x2 = 14;
      let z = 0;
      let score = 0;
      let hiScore = 20000;
      let rode = 0;
      let ab = 0;
      let ex = 14;
      let fx = 1;
      let gx = -1;
      let flash = 0;
      let lastTime = 0;
      let accumulator = 0;
      let audio;

      function put(x, y, text) {
        if (y < 0 || y >= ROWS) return;
        for (let i = 0; i < text.length; i += 1) {
          const xx = x + i;
          if (xx >= 0 && xx < COLS) cells[y][xx] = text[i];
        }
      }

      function fill(x, y, w, h, ch) {
        for (let yy = y; yy < y + h; yy += 1) {
          for (let xx = x; xx < x + w; xx += 1) put(xx, yy, ch);
        }
      }

      function at(x, y) {
        if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return CH.WALL;
        return cells[y][x];
      }

      function clearScreen() {
        for (const row of cells) row.fill(" ");
      }

      function clearPlayfield() {
        for (let y = 0; y < ROWS; y += 1) {
          for (let x = 0; x <= PLAY_R; x += 1) cells[y][x] = CH.GROUND;
        }
        for (let y = 0; y < ROWS; y += 1) {
          cells[y][ROAD_L] = CH.LEFT;
          for (let x = ROAD_L + 1; x < ROAD_R; x += 1) cells[y][x] = " ";
          cells[y][ROAD_R] = CH.RIGHT;
        }
      }

      function resetGame() {
        x1 = 14;
        x2 = 14;
        z = 0;
        score = 0;
        rode = 0;
        ab = 0;
        ex = 14;
        fx = 1;
        gx = -1;
        flash = 0;
        clearScreen();
        clearPlayfield();
        stepChaser();
        put(x1, 18, CH.CAR);
        put(9, 15, CH.BAR.repeat(9));
        put(9, 15, "HIT ANY KEY");
        updateStatus();
        state = "title";
      }

      function scrollPlayfield() {
        for (let y = 23; y > 0; y -= 1) {
          for (let x = 0; x <= PLAY_R; x += 1) cells[y][x] = cells[y - 1][x];
        }
        for (let x = 0; x <= PLAY_R; x += 1) cells[0][x] = CH.GROUND;
        cells[0][ROAD_L] = CH.LEFT;
        for (let x = ROAD_L + 1; x < ROAD_R; x += 1) cells[0][x] = " ";
        cells[0][ROAD_R] = CH.RIGHT;
      }

      function clearTopRoad(width = 11) {
        for (let x = ROAD_L + 1; x < ROAD_R; x += 1) cells[0][x] = " ";
        if (width < 11) {
          const start = 9 + Math.floor(Math.random() * (12 - width));
          for (let i = 0; i < width; i += 1) cells[0][start + i] = " ";
        }
      }

      function updateStatus() {
        if (hiScore < score) hiScore = score;
        for (let y = 0; y < ROWS; y += 1) {
          for (let x = 29; x < COLS; x += 1) cells[y][x] = " ";
        }
        put(29, 2, "HIGH SCORE");
        put(32, 4, String(hiScore).padStart(4, " "));
        put(29, 7, "YOUR SCORE");
        put(32, 9, String(score).padStart(5, " "));
        if (rode % 6 === 0) {
          put(29, 12, flash % 16 < 8 ? "NONUS RODE" : "          ");
        } else {
          put(29, 12, `RODE :${String(rode).padStart(4, " ")}`);
        }
      }

      function playTone(freq, length = 0.05, gain = 0.03) {
        if (!audio) return;
        const osc = audio.createOscillator();
        const amp = audio.createGain();
        osc.type = "square";
        osc.frequency.value = freq;
        amp.gain.value = gain;
        osc.connect(amp);
        amp.connect(audio.destination);
        osc.start();
        osc.stop(audio.currentTime + length);
      }

      function ensureAudio() {
        if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
        if (audio.state === "suspended") audio.resume();
      }

      function startRun() {
        ensureAudio();
        put(9, 15, "           ");
        state = "play";
        playTone(440, 0.08);
        setTimeout(() => playTone(440, 0.08), 120);
        setTimeout(() => playTone(440, 0.08), 240);
      }

      function crash() {
        state = "over";
        playTone(90, 0.35, 0.05);
        put(10, 10, "Try again");
        put(9, 12, "[ Y or N ]?");
      }

      function endGame() {
        state = "ended";
        clearScreen();
        put(14, 10, "HIGH DRIVE");
        put(13, 12, "GAME  END");
        put(9, 16, "PRESS SPACE TO RESTART");
      }

      function addBonus() {
        const bonus = Math.floor(score / 10);
        if (bonus > 0) {
          put(12, 10, "BONUS");
          score += bonus;
          playTone(523, 0.08, 0.04);
        }
      }

      function finishSection(nextFx = fx) {
        ab = 0;
        rode += 1;
        fx = nextFx;
        updateStatus();
      }

      function modeBonus() {
        ab += 1;
        if (ab >= 17 && ab <= 180) {
          ex = Math.floor(Math.random() * 11) + 9;
          fx = Math.floor(Math.random() * 30) + 1;
          put(ex, 0, fx === 30 ? CH.BIG : CH.SMALL);
        }
        if (ab === 200) {
          finishSection(0);
          addBonus();
        }
      }

      function modeGaps() {
        if (ab % 10 === 0) {
          for (let x = 9; x <= 17; x += 1) put(x, 0, CH.BAR);
          const gap = Math.floor(Math.random() * 9) + 9;
          put(gap, 0, "    ");
        }
        if (ab === 200) {
          finishSection();
        } else {
          ab += 1;
        }
        score += 1;
      }

      function modeCars() {
        ab += 1;
        let interval = Math.floor(Math.random() * Math.max(1, 10 - rode / 2)) + 1;
        if (interval < 1) interval = 1;
        if (ab % interval === 0) put(Math.floor(Math.random() * 11) + 9, 0, CH.CAR);
        if (ab === 200) {
          finishSection();
        } else {
          score += 1;
        }
      }

      function modeCurve() {
        ab += 1;
        score += 1;
        if (ab === 1) ex = Math.floor(Math.random() * 9) + 9;
        ex += Math.floor(Math.random() * 3) - 1;
        ex = Math.max(9, Math.min(16, ex));
        for (let x = 9; x <= 17; x += 1) put(x, 0, CH.BLOCK);
        put(ex, 0, "    ");
        if (ab === 200) {
          ex = Math.floor(Math.random() * 7) + 9;
          finishSection(1);
        }
      }

      function modeWall() {
        ab += 1;
        score += 1;
        if (ab < 22) return;
        if (Math.floor(Math.random() * 10) === 0) put(Math.floor(Math.random() * 11) + 9, 0, "D");
        if (fx > 22) {
          fx = 1;
          ex = Math.floor(Math.random() * 7) + 9;
        } else {
          fx += 2;
        }
        put(ex, fx - 1, "     ");
        put(ex, fx, CH.WALL.repeat(5));
        if (ab === 200) finishSection(1);
      }

      function modeChaser() {
        ab += 1;
        if (ab > 201) {
          rode += 1;
          ab = 0;
          return;
        }
        score += 1;
        if (Math.floor(Math.random() * 5) === 0) put(Math.floor(Math.random() * 11) + 9, 0, CH.BLOCK);
        if (fx > 22) {
          fx = 1;
          ex = Math.floor(Math.random() * 11) + 9;
        } else {
          fx += 2;
        }
        if (Math.floor(Math.random() * 100) < 30) {
          gx = ex < x1 ? 1 : -1;
        } else {
          gx = ex > x1 ? 1 : -1;
        }
        stepChaser();
      }

      function stepChaser() {
        const next = at(ex + gx, fx);
        if (next !== " " && next !== "X") gx = gx === -1 ? 1 : -1;
        ex += gx;
        put(ex, fx, "F");
        put(ex - gx, fx - 1, " ");
      }

      function runMode() {
        switch (rode % 6) {
          case 0: modeBonus(); break;
          case 1: modeGaps(); break;
          case 2: modeCars(); break;
          case 3: modeCurve(); break;
          case 4: modeWall(); break;
          case 5: modeChaser(); break;
        }
      }

      function inputVector() {
        const left = keys.has("ArrowLeft") || keys.has("KeyA") || keys.has("Numpad4");
        const right = keys.has("ArrowRight") || keys.has("KeyD") || keys.has("Numpad6");
        return (left ? -1 : 0) + (right ? 1 : 0);
      }

      function tick() {
        flash += 1;
        if (state !== "play") {
          updateStatus();
          draw();
          return;
        }

        scrollPlayfield();
        put(x2 - z, 19, CH.SHADOW);
        put(x1, 18, CH.CAR);

        const v = inputVector();
        runMode();
        const target = at(x1 + v, 17);

        if (target === " ") {
          x1 += v;
          x2 += v;
          z = v;
        } else if (target === CH.BIG) {
          score += 1000;
          playTone(880, 0.05);
          x1 += v;
          x2 += v;
          z = v;
        } else if (target === CH.SMALL) {
          score += 100;
          playTone(440, 0.05);
          x1 += v;
          x2 += v;
          z = v;
        } else {
          crash();
        }

        updateStatus();
        draw();
      }

      function drawGlyph(ch, x, y) {
        const px = x * CELL_W;
        const py = y * CELL_H;
        if (ch === " ") return;

        if (ch === CH.GROUND) {
          ctx.fillStyle = "#17180f";
          ctx.fillRect(px + 7, py + 16, 4, 4);
          ctx.fillRect(px + 15, py + 8, 3, 3);
          return;
        }
        if (ch === CH.LEFT || ch === CH.RIGHT) {
          ctx.fillStyle = "#d8d8c2";
          const offset = ch === CH.LEFT ? 17 : 3;
          ctx.fillRect(px + offset, py, 4, CELL_H);
          ctx.fillRect(px + offset - 2, py + 8, 8, 3);
          ctx.fillRect(px + offset - 2, py + 17, 8, 3);
          return;
        }
        if (ch === CH.CAR || ch === CH.SHADOW) {
          const main = ch === CH.CAR ? "#e8e8d8" : "#6f7164";
          ctx.fillStyle = main;
          ctx.fillRect(px + 8, py + 2, 8, 4);
          ctx.fillRect(px + 6, py + 6, 12, 12);
          ctx.fillRect(px + 4, py + 12, 16, 7);
          ctx.fillStyle = "#080808";
          ctx.fillRect(px + 7, py + 7, 3, 4);
          ctx.fillRect(px + 14, py + 7, 3, 4);
          ctx.fillRect(px + 5, py + 18, 4, 3);
          ctx.fillRect(px + 15, py + 18, 4, 3);
          return;
        }
        if (ch === CH.SMALL || ch === CH.BIG) {
          ctx.fillStyle = ch === CH.BIG ? "#d7d05e" : "#8fc874";
          ctx.beginPath();
          ctx.moveTo(px + 12, py + 3);
          ctx.lineTo(px + 20, py + 12);
          ctx.lineTo(px + 12, py + 21);
          ctx.lineTo(px + 4, py + 12);
          ctx.closePath();
          ctx.fill();
          if (ch === CH.BIG) {
            ctx.fillStyle = "#080808";
            ctx.fillRect(px + 10, py + 6, 4, 12);
            ctx.fillRect(px + 6, py + 10, 12, 4);
          }
          return;
        }
        if (ch === CH.BAR) {
          ctx.fillStyle = "#d8d8c2";
          ctx.fillRect(px, py + 9, CELL_W, 5);
          return;
        }
        if (ch === CH.BLOCK) {
          ctx.fillStyle = "#d8d8c2";
          ctx.fillRect(px + 2, py + 2, 20, 20);
          ctx.fillStyle = "#080808";
          ctx.fillRect(px + 6, py + 6, 12, 12);
          return;
        }
        if (ch === CH.WALL) {
          ctx.fillStyle = "#d8d8c2";
          ctx.fillRect(px + 10, py, 4, CELL_H);
          ctx.fillRect(px + 2, py + 3, 20, 4);
          ctx.fillRect(px + 2, py + 12, 20, 4);
          ctx.fillRect(px + 2, py + 21, 20, 3);
          return;
        }
        if (ch === "D") {
          ctx.fillStyle = "#d8d8c2";
          ctx.font = "20px ui-monospace, monospace";
          ctx.fillText("D", px + 5, py + 19);
          return;
        }
        if (ch === "F") {
          ctx.fillStyle = "#d8d8c2";
          ctx.font = "20px ui-monospace, monospace";
          ctx.fillText("F", px + 5, py + 19);
          return;
        }

        return;
      }

      function draw() {
        ctx.fillStyle = "#080808";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#12140e";
        ctx.fillRect(0, 0, 232 / 320 * canvas.width, 8 / 200 * canvas.height);

        for (let y = 0; y < ROWS; y += 1) {
          for (let x = 0; x < COLS; x += 1) drawGlyph(cells[y][x], x, y);
        }

        ctx.fillStyle = "#e8e8d8";
        ctx.font = "20px ui-monospace, monospace";
        ctx.textBaseline = "alphabetic";
        for (let y = 0; y < ROWS; y += 1) {
          let run = "";
          let start = 0;
          for (let x = 0; x <= COLS; x += 1) {
            const ch = x < COLS ? cells[y][x] : "";
            const drawableText = ch && ch.length === 1 && ch !== " " && !["D", "F", ...Object.values(CH)].includes(ch);
            if (drawableText) {
              if (!run) start = x;
              run += ch;
            } else if (run) {
              ctx.fillText(run, start * CELL_W + 3, y * CELL_H + 19);
              run = "";
            }
          }
        }
      }

      function frame(time) {
        if (!lastTime) lastTime = time;
        accumulator += time - lastTime;
        lastTime = time;
        while (accumulator >= 58) {
          tick();
          accumulator -= 58;
        }
        requestAnimationFrame(frame);
      }

      window.addEventListener("keydown", (event) => {
        keys.add(event.code);
        if (["ArrowLeft", "ArrowRight", "Space"].includes(event.code)) event.preventDefault();
        if (state === "title") startRun();
        if (state === "ended" && event.code === "Space") resetGame();
        if (state === "over") {
          if (event.key === "y" || event.key === "Y") {
            resetGame();
            startRun();
          }
          if (event.key === "n" || event.key === "N") endGame();
        }
      });

      window.addEventListener("keyup", (event) => {
        keys.delete(event.code);
      });

      resetGame();
      draw();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
