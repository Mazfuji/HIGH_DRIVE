<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HIGH DRIVE</title>
  <style>
    @font-face {
      font-family: "Arcade8x8ASCII";
      src: url("arcade_8x8_ascii_font.svg#Arcade8x8ASCII") format("svg");
    }

    :root {
      color-scheme: dark;
      --screen-green: #78ff70;
      --screen-amber: #ffd95c;
      --screen-red: #ff5959;
      --screen-cyan: #58e7ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: #101114;
      color: var(--screen-green);
      font-family: "Arcade8x8ASCII", monospace;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .cabinet {
      width: min(100vw, 128vh);
      max-width: 960px;
      padding: clamp(10px, 2.2vw, 22px);
      background: #202226;
      border: 1px solid #3a3c42;
      box-shadow:
        inset 0 0 0 2px #111317,
        0 24px 70px rgba(0, 0, 0, .5);
    }

    .bezel {
      position: relative;
      padding: clamp(8px, 1.5vw, 16px);
      background: #050606;
      border: 1px solid #32363a;
    }

    svg {
      display: block;
      width: 100%;
      aspect-ratio: 40 / 25;
      background: #050807;
      image-rendering: pixelated;
      shape-rendering: crispEdges;
    }

    .scanlines {
      position: absolute;
      inset: clamp(8px, 1.5vw, 16px);
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, .04) 0,
        rgba(255, 255, 255, .04) 1px,
        rgba(0, 0, 0, .08) 2px,
        rgba(0, 0, 0, .08) 4px
      );
      mix-blend-mode: screen;
      opacity: .45;
    }

    .fullscreen-button {
      position: absolute;
      right: clamp(12px, 2vw, 20px);
      bottom: clamp(12px, 2vw, 20px);
      width: 36px;
      height: 36px;
      padding: 0;
      color: #f2f2f2;
      background: rgba(5, 6, 6, .72);
      border: 1px solid #555b62;
      border-radius: 4px;
      cursor: pointer;
    }

    .fullscreen-button svg {
      width: 20px;
      height: 20px;
      margin: 7px;
      background: transparent;
      aspect-ratio: 1;
      stroke: currentColor;
    }

    .fullscreen-button:focus-visible {
      outline: 2px solid var(--screen-cyan);
      outline-offset: 2px;
    }

    .cabinet:fullscreen {
      width: 100vw;
      max-width: none;
      height: 100vh;
      display: grid;
      place-items: center;
      padding: min(2vh, 18px);
      background: #050606;
    }

    .cabinet:fullscreen .bezel {
      width: min(calc(100vw - 36px), calc((100vh - 36px) * 1.6));
      padding: min(1.5vh, 14px);
    }

    .cabinet:fullscreen .scanlines {
      inset: min(1.5vh, 14px);
    }
  </style>
</head>
<body>
  <main class="cabinet">
    <div class="bezel">
      <svg id="screen" viewBox="0 0 320 200" aria-label="HIGH DRIVE game screen"></svg>
      <div class="scanlines"></div>
      <button class="fullscreen-button" id="fullscreenButton" type="button" aria-label="Toggle fullscreen" title="Fullscreen (F)">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="square">
          <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/>
        </svg>
      </button>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const COLS = 40;
      const ROWS = 25;
      const GAME_COLS = 29;
      const CELL = 8;
      const PLAYER_Y = 18;
      const ROAD_SPACES = 11;
      const FRAME_MS = 92;
      const HAZARD_DELAY_MS = FRAME_MS / 2;
      const CUSTOM = new Set([224, 225, 226, 227, 228, 229, 230, 231, 232, 233, 234, 235]);
      const HIGH_SCORE_KEY = "high-drive.high-score";
      const NS = "http://www.w3.org/2000/svg";
      const XLINK = "http://www.w3.org/1999/xlink";
      const screen = document.getElementById("screen");
      const cabinet = document.querySelector(".cabinet");
      const fullscreenButton = document.getElementById("fullscreenButton");
      const cells = [];
      let psg = null;
      let soundToken = 0;
      const state = {
        mode: "title",
        playerX: 14,
        shadowX: 14,
        roadLeft: 8,
        score: 0,
        highScore: loadHighScore(),
        stage: 1,
        tick: 0,
        stageTick: 0,
        lastMove: 0,
        keys: new Set(),
        chase: null,
        iceGap: 9,
        barrel: null,
        flash: 0,
        bonusRemaining: 0,
        delayedHazardToken: 0,
      };

      const COLORS = {
        main: "#78ff70",
        dim: "#227d39",
        wall: "#f2f2f2",
        road: "#050807",
        text: "#78ff70",
        red: "#ff5959",
        amber: "#ffd95c",
        cyan: "#58e7ff",
      };

      const buffer = Array.from({ length: ROWS }, () =>
        Array.from({ length: COLS }, () => ({ code: 32, color: COLORS.main }))
      );

      class Ay38910 {
        constructor() {
          this.clock = 1789750;
          this.context = null;
          this.node = null;
          this.registers = new Uint8Array(16);
          this.tonePhase = [0, 0, 0];
          this.toneOutput = [1, 1, 1];
          this.noisePhase = 0;
          this.noiseOutput = 1;
          this.noiseLfsr = 0x1ffff;
          this.envelopePhase = 0;
          this.envelopeStep = 0;
          this.envelopeShape = 0;
          this.masterGain = .16;
          this.volumeTable = Array.from({ length: 16 }, (_, i) => {
            return i === 0 ? 0 : Math.pow(10, (i - 15) * 1.5 / 20);
          });
        }

        async start() {
          if (!this.context) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            this.context = new AudioContext();
            this.node = this.context.createScriptProcessor(1024, 0, 1);
            this.node.onaudioprocess = (event) => this.process(event.outputBuffer.getChannelData(0));
            this.node.connect(this.context.destination);
            this.mute();
          }
          if (this.context.state === "suspended") await this.context.resume();
        }

        write(register, value) {
          this.registers[register & 15] = value & 255;
          if ((register & 15) === 13) {
            this.envelopeShape = value & 15;
            this.envelopeStep = (this.envelopeShape & 4) ? 0 : 15;
            this.envelopePhase = 0;
          }
        }

        mute() {
          this.write(7, 63);
          this.write(8, 0);
          this.write(9, 0);
          this.write(10, 0);
        }

        sound(register, value) {
          this.start();
          this.write(register, value);
        }

        tone(channel, note, duration = .08, volume = 12) {
          this.start();
          const semitones = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
          const midi = (note.octave + 1) * 12 + semitones[note.name];
          const freq = 440 * Math.pow(2, (midi - 69) / 12);
          const period = Math.max(1, Math.round(this.clock / (16 * freq)));
          const lo = channel * 2;
          this.write(lo, period & 255);
          this.write(lo + 1, (period >> 8) & 15);
          this.write(7, this.registers[7] & ~(1 << channel));
          this.write(8 + channel, volume & 15);
          window.setTimeout(() => this.write(8 + channel, 0), duration * 1000);
        }

        process(output) {
          if (!this.context) return;
          const sampleRate = this.context.sampleRate;
          for (let i = 0; i < output.length; i++) {
            const noisePeriod = Math.max(1, this.registers[6] & 31);
            const noiseFreq = this.clock / (16 * noisePeriod);
            this.noisePhase += noiseFreq / sampleRate;
            while (this.noisePhase >= 1) {
              this.noisePhase -= 1;
              const bit = (this.noiseLfsr ^ (this.noiseLfsr >> 3)) & 1;
              this.noiseLfsr = (this.noiseLfsr >> 1) | (bit << 16);
              this.noiseOutput = (this.noiseLfsr & 1) ? 1 : -1;
            }

            this.advanceEnvelope(sampleRate);
            let mix = 0;
            for (let ch = 0; ch < 3; ch++) {
              const period = Math.max(1, ((this.registers[ch * 2 + 1] & 15) << 8) | this.registers[ch * 2]);
              const freq = this.clock / (16 * period);
              this.tonePhase[ch] += freq / sampleRate;
              while (this.tonePhase[ch] >= 1) {
                this.tonePhase[ch] -= 1;
                this.toneOutput[ch] *= -1;
              }

              const toneEnabled = (this.registers[7] & (1 << ch)) === 0;
              const noiseEnabled = (this.registers[7] & (1 << (ch + 3))) === 0;
              const tone = toneEnabled ? this.toneOutput[ch] : 1;
              const noise = noiseEnabled ? this.noiseOutput : 1;
              const ampRegister = this.registers[8 + ch];
              const level = (ampRegister & 16) ? this.envelopeLevel() : (ampRegister & 15);
              mix += tone * noise * this.volumeTable[level];
            }
            output[i] = Math.max(-1, Math.min(1, mix * this.masterGain));
          }
        }

        advanceEnvelope(sampleRate) {
          const period = Math.max(1, (this.registers[12] << 8) | this.registers[11]);
          this.envelopePhase += (this.clock / (256 * period)) / sampleRate;
          while (this.envelopePhase >= 1) {
            this.envelopePhase -= 1;
            if (this.envelopeShape & 4) {
              this.envelopeStep++;
              if (this.envelopeStep > 15) this.envelopeStep = (this.envelopeShape & 8) ? 0 : 15;
            } else {
              this.envelopeStep--;
              if (this.envelopeStep < 0) this.envelopeStep = (this.envelopeShape & 8) ? 15 : 0;
            }
          }
        }

        envelopeLevel() {
          return (this.envelopeShape & 4) ? this.envelopeStep : 15 - this.envelopeStep;
        }
      }

      function ensureSound() {
        if (!psg) psg = new Ay38910();
        psg.start();
      }

      function sound(register, value) {
        if (!psg) return;
        psg.sound(register, value);
      }

      function startSoundCue() {
        ensureSound();
        const token = ++soundToken;
        psg.tone(1, { name: "A", octave: 4 }, .18, 13);
        window.setTimeout(() => {
          if (soundToken === token) psg.tone(1, { name: "A", octave: 4 }, .18, 13);
        }, 300);
        window.setTimeout(() => {
          if (soundToken === token) psg.tone(1, { name: "A", octave: 4 }, .18, 13);
        }, 600);
        window.setTimeout(() => {
          if (soundToken !== token) return;
          sound(0, 141);
          sound(1, 0);
          sound(7, 10);
          sound(8, 31);
          sound(12, 40);
          sound(13, 9);
        }, 820);
        window.setTimeout(() => {
          if (soundToken === token) engineSound();
        }, 1250);
      }

      function engineSound() {
        if (!psg || state.mode !== "play") return;
        const pitch = clamp(210 - state.stage * 6 - Math.abs(state.lastMove) * 20, 40, 255);
        sound(0, pitch);
        sound(1, 2);
        sound(7, 10);
        sound(8, 31);
        sound(12, 1);
        sound(13, 10);
      }

      function crashSound() {
        ensureSound();
        const token = ++soundToken;
        sound(0, 180);
        sound(1, 12);
        sound(6, 63);
        sound(7, 17);
        sound(8, 31);
        sound(12, 50);
        sound(13, 9);
        window.setTimeout(() => {
          if (soundToken === token) psg?.mute();
        }, 900);
      }

      function bonusSound(big) {
        ensureSound();
        psg.tone(1, { name: "A", octave: big ? 5 : 4 }, .12, 14);
      }

      function bonusCountSound() {
        ensureSound();
        psg.tone(1, { name: "C", octave: 5 }, .05, 10);
      }

      function makeScreen() {
        const bg = document.createElementNS(NS, "rect");
        bg.setAttribute("width", "320");
        bg.setAttribute("height", "200");
        bg.setAttribute("fill", "#050807");
        screen.appendChild(bg);

        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            const use = document.createElementNS(NS, "use");
            use.setAttribute("x", x * CELL);
            use.setAttribute("y", y * CELL);
            use.setAttribute("width", CELL);
            use.setAttribute("height", CELL);
            use.style.imageRendering = "pixelated";
            screen.appendChild(use);
            cells.push(use);
          }
        }
      }

      function setCell(x, y, code, color = COLORS.main) {
        if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;
        buffer[y][x].code = code;
        buffer[y][x].color = color;
      }

      function printText(x, y, text, color = COLORS.text) {
        for (let i = 0; i < text.length; i++) {
          setCell(x + i, y, text.charCodeAt(i), color);
        }
      }

      function fillRect(x, y, w, h, code, color = COLORS.main) {
        for (let yy = y; yy < y + h; yy++) {
          for (let xx = x; xx < x + w; xx++) setCell(xx, yy, code, color);
        }
      }

      function clearAll() {
        fillRect(0, 0, COLS, ROWS, 32);
      }

      function clearGameArea() {
        fillRect(0, 0, GAME_COLS, ROWS, 226);
        for (let y = 0; y < ROWS; y++) drawRoadRow(y, state.roadLeft);
      }

      function drawRoadRow(y, left) {
        for (let x = 0; x < GAME_COLS; x++) setCell(x, y, 226);
        setCell(left, y, 228);
        for (let x = roadMin(); x <= roadMax(); x++) setCell(x, y, 32);
        setCell(roadRight(), y, 227);
      }

      function title() {
        if (psg) psg.mute();
        resetGame();
        clearAll();
        clearGameArea();
        printText(9, 6, "HIGH DRIVE", COLORS.amber);
        printText(9, 15, "HIT ANY KEY", COLORS.text);
        setCell(state.playerX, PLAYER_Y, 224);
        drawStatus();
        render();
      }

      function resetGame() {
        state.mode = "title";
        state.playerX = 14;
        state.shadowX = 14;
        state.roadLeft = 8;
        state.score = 0;
        state.stage = 1;
        state.tick = 0;
        state.stageTick = 0;
        state.lastMove = 0;
        state.chase = null;
        state.iceGap = roadMin();
        state.barrel = null;
        state.flash = 0;
        state.bonusRemaining = 0;
        state.delayedHazardToken = 0;
      }

      function startGame() {
        state.mode = "play";
        state.tick = 0;
        state.stageTick = 0;
        clearAll();
        clearGameArea();
        startSoundCue();
      }

      function shiftGameDown() {
        for (let y = ROWS - 1; y > 0; y--) {
          for (let x = 0; x < GAME_COLS; x++) {
            buffer[y][x].code = buffer[y - 1][x].code;
            buffer[y][x].color = buffer[y - 1][x].color;
          }
        }
      }

      function spawnTopRow() {
        const section = ((state.stage - 1) % 6) + 1;
        const loop = Math.floor((state.stage - 1) / 6);
        drawRoadRow(0, state.roadLeft);

        if (section === 1 && state.stageTick > 0 && state.stageTick % 10 === 0) {
          const gap = randInt(roadMin(), roadMax() - 3);
          for (let x = roadMin(); x <= roadMax(); x++) setCell(x, 0, 231);
          for (let x = gap; x < gap + 4; x++) setCell(x, 0, 32);
        }

        if (section === 2 && Math.random() < Math.min(.1 + loop * .06, .34)) {
          setCell(randInt(roadMin(), roadMax()), 0, 225);
        }

        if (section === 3) {
          state.iceGap = clamp(state.iceGap + randInt(-1, 1), roadMin(), roadMax() - 3);
          for (let x = roadMin(); x <= roadMax(); x++) setCell(x, 0, 233);
          for (let x = state.iceGap; x < state.iceGap + 4; x++) setCell(x, 0, 32);
        }

        if (section === 4 && Math.random() < .15) {
          setCell(randInt(roadMin(), roadMax()), 0, 233);
        }

        if (section === 4 && state.stageTick > 22 && state.stageTick % 18 === 0) {
          const x0 = randInt(roadMin(), roadMax() - 4);
          for (let x = x0; x < x0 + 5; x++) setCell(x, 0, 234);
        }

        if (section === 5 && Math.random() < Math.min(.08 + loop * .05, .28)) {
          setCell(randInt(roadMin(), roadMax()), 0, 225);
        }

        if (section === 6 && Math.random() < .2) {
          setCell(randInt(roadMin(), roadMax()), 0, Math.random() < .12 ? 230 : 229);
        }
      }

      function updateChaser() {
        if (((state.stage - 1) % 6) + 1 !== 5) return;
        if (!state.chase || state.chase.y > 22) {
          state.chase = { x: randInt(roadMin(), roadMax()), y: 0 };
        }
        const oldX = state.chase.x;
        const oldY = state.chase.y + 1;
        state.chase.x += randInt(-1, 1);
        state.chase.x = clamp(state.chase.x, roadMin(), roadMax());
        state.chase.y += 2;
        if (buffer[oldY]?.[oldX]?.code === 235) setCell(oldX, oldY, 32);
        if (state.chase.x === state.playerX && state.chase.y === PLAYER_Y) {
          crash();
          return;
        }
        if (state.chase.y < ROWS) setCell(state.chase.x, state.chase.y, 235);
      }

      function updateBarrels() {
        if (((state.stage - 1) % 6) + 1 !== 4) return;
        for (let y = ROWS - 1; y >= 0; y--) {
          for (let x = roadMin(); x <= roadMax(); x++) {
            if (buffer[y][x].code !== 234) continue;
            setCell(x, y, 32);
            if (x === state.playerX && y + 1 === PLAYER_Y) {
              crash();
              return;
            }
            if (y + 1 < ROWS) setCell(x, y + 1, 234);
          }
        }
      }

      function updatePlayer() {
        let move = 0;
        if (state.keys.has("ArrowLeft") || state.keys.has("KeyA")) move -= 1;
        if (state.keys.has("ArrowRight") || state.keys.has("KeyD")) move += 1;
        state.lastMove = move;
        state.shadowX = state.playerX;
        const nextX = clamp(state.playerX + move, 1, GAME_COLS - 2);
        const hit = buffer[PLAYER_Y][nextX].code;

        if (hit === 229) {
          state.score += 100;
          bonusSound(false);
        } else if (hit === 230) {
          state.score += 1000;
          bonusSound(true);
        } else if (hit !== 32 && hit !== 232) {
          crash();
          return;
        }

        state.playerX = nextX;
        setCell(state.shadowX, PLAYER_Y + 1, 232);
        setCell(state.playerX, PLAYER_Y, 224);
      }

      function drawStatus() {
        const statusColor = COLORS.wall;
        fillRect(29, 0, 11, ROWS, 32);
        printText(29, 2, "HIGH SCORE", statusColor);
        printText(32, 4, String(state.highScore).padStart(5, " "), statusColor);
        printText(29, 7, "YOUR SCORE", statusColor);
        printText(31, 9, String(state.score).padStart(6, " "), statusColor);
        if (state.stage % 6 === 0) {
          printText(29, 12, "BONUS RODE", statusColor);
        } else {
          printText(29, 12, "RODE :" + String(state.stage).padStart(4, " "), statusColor);
        }
      }

      function frame() {
        if (state.mode === "bonus_count") {
          updateBonusCount();
          return;
        }
        if (state.mode !== "play") return;
        state.tick++;
        state.stageTick++;
        state.score++;
        updateHighScore();

        const stageAtFrameStart = currentStage();
        const delayedHazards = stageAtFrameStart === 4 || stageAtFrameStart === 5;

        shiftGameDown();
        spawnTopRow();
        if (!delayedHazards) {
          updateBarrels();
          if (state.mode !== "play") return;
          updateChaser();
        }
        updatePlayer();
        if (state.mode !== "play") return;
        engineSound();

        if (state.stageTick >= 200) {
          const endedBonusStage = currentStage() === 6;
          state.stage++;
          state.stageTick = 0;
          state.chase = null;
          state.barrel = null;
          state.iceGap = roadMin();
          if (endedBonusStage) {
            startBonusCount(Math.floor(state.score / 10));
          }
        }
        drawStatus();
        render();
        if (delayedHazards && state.mode === "play" && currentStage() === stageAtFrameStart) {
          scheduleDelayedHazards(state.stage, state.stageTick);
        }
      }

      function scheduleDelayedHazards(stage, stageTick) {
        const token = ++state.delayedHazardToken;
        window.setTimeout(() => {
          if (state.mode !== "play") return;
          if (state.delayedHazardToken !== token) return;
          if (state.stage !== stage || state.stageTick !== stageTick) return;
          updateBarrels();
          if (state.mode !== "play") return;
          updateChaser();
          if (state.mode !== "play") return;
          drawStatus();
          render();
        }, HAZARD_DELAY_MS);
      }

      function startBonusCount(amount) {
        state.mode = "bonus_count";
        state.bonusRemaining = amount;
        printBonusCountLabel();
        drawStatus();
        render();
      }

      function updateBonusCount() {
        state.tick++;
        const step = Math.max(1, Math.ceil(state.bonusRemaining / 20));
        const add = Math.min(step, state.bonusRemaining);
        state.score += add;
        state.bonusRemaining -= add;
        updateHighScore();
        printBonusCountLabel();
        drawStatus();
        render();
        if (state.bonusRemaining <= 0) {
          printText(12, 10, "     ", COLORS.main);
          state.mode = "play";
          engineSound();
          render();
        }
      }

      function printBonusCountLabel() {
        const colors = [COLORS.wall, COLORS.amber, COLORS.cyan, COLORS.red, COLORS.main];
        printText(12, 10, "BONUS", colors[state.tick % colors.length]);
        bonusCountSound();
      }

      function crash() {
        state.mode = "over";
        state.flash = 70;
        crashSound();
        drawStatus();
        printText(10, 10, "Try again", COLORS.red);
        printText(9, 12, "[ Y or N ]?", COLORS.red);
        render();
      }

      function render() {
        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            const item = buffer[y][x];
            const use = cells[y * COLS + x];
            const code = item.code;
            const href = CUSTOM.has(code)
              ? `high_drive_defchr.svg#char-${code}`
              : `arcade_8x8_ascii_font.svg#px-${code >= 32 && code <= 127 ? code : 32}`;
            use.setAttribute("href", href);
            use.setAttributeNS(XLINK, "href", href);
            use.setAttribute("fill", item.color);
            use.style.visibility = code === 32 ? "hidden" : "visible";
          }
        }
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }


      function loadHighScore() {
        try {
          const value = Number.parseInt(localStorage.getItem(HIGH_SCORE_KEY) || "", 10);
          return Number.isFinite(value) && value > 0 ? value : 20000;
        } catch {
          return 20000;
        }
      }

      function updateHighScore() {
        if (state.score <= state.highScore) return;
        state.highScore = state.score;
        try {
          localStorage.setItem(HIGH_SCORE_KEY, String(state.highScore));
        } catch {
          // Ignore storage errors; the in-memory score still updates.
        }
      }

      function currentStage() {
        return ((state.stage - 1) % 6) + 1;
      }

      function roadMin() {
        return state.roadLeft + 1;
      }

      function roadMax() {
        return state.roadLeft + ROAD_SPACES;
      }

      function roadRight() {
        return state.roadLeft + ROAD_SPACES + 1;
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          cabinet.requestFullscreen?.();
        } else {
          document.exitFullscreen?.();
        }
      }

      window.addEventListener("keydown", (event) => {
        state.keys.add(event.code);
        if (["ArrowLeft", "ArrowRight", "Space", "KeyA", "KeyD", "KeyF"].includes(event.code)) event.preventDefault();

        if (event.code === "KeyF") {
          toggleFullscreen();
          return;
        }

        if (state.mode === "title") {
          startGame();
          return;
        }
        if (state.mode === "over") {
          if (event.key === "y" || event.key === "Y") {
            resetGame();
            startGame();
          }
          if (event.key === "n" || event.key === "N") title();
        }
      });

      window.addEventListener("keyup", (event) => {
        state.keys.delete(event.code);
      });

      fullscreenButton.addEventListener("click", (event) => {
        event.stopPropagation();
        toggleFullscreen();
      });

      makeScreen();
      title();
      setInterval(frame, FRAME_MS);
    })();
  </script>
</body>
</html>
